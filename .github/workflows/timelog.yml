# ActivityWatch + TimeLog: the Qt edition for Windows, with aw-timelog bundled and started by default.
# A tag `timelog-v*` publishes the installer as a GitHub release; anything else leaves it as an artifact.
name: TimeLog installer

on:
  push:
    branches: [timelog]
    tags: ["timelog-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      POETRY_INSTALLER_PARALLEL: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # `npm ci` wipes node_modules, so the download cache is what a rebuild reuses.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/aw-webui/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      # The Rust server is most of the build; a rebuild reuses what did not change.
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: aw-server-rust/target
          key: windows-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install dependencies
        run: |
          choco install innosetup
          pip3 install poetry==2.2.1

      # One venv for every submodule: poetry installs into the active one instead of making its own.
      - name: Build
        run: |
          python3 -m venv venv
          source venv/Scripts/activate
          # Our tags are named timelog-v*, not a version: aw-server-rust would write the name into Cargo.toml.
          export GITHUB_REF_TYPE=branch
          poetry install
          make build

      - name: Package
        run: |
          source venv/Scripts/activate
          export GITHUB_REF_TYPE=branch
          poetry install
          make package

      # The file being there is not enough: aw-qt has to find it, or it never starts.
      - name: aw-timelog is in the bundle and aw-qt finds it
        run: |
          test -f dist/activitywatch/aw-client/aw-timelog.exe
          source venv/Scripts/activate
          python -c "from aw_qt import manager; found = {m.name for m in manager.filter_modules(manager._discover_modules_in_directory('dist/activitywatch'))}; print(sorted(found)); assert 'aw-timelog' in found"

      - uses: actions/upload-artifact@v4
        with:
          name: activitywatch-timelog-windows
          path: dist/activitywatch-*-setup.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/timelog-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/activitywatch-*-setup.exe \
            --title "ActivityWatch + TimeLog $GITHUB_REF_NAME" \
            --notes "ActivityWatch con aw-timelog. Pega tu llave de TimeLog en el ícono, en «TimeLog: pegar llave…»."
